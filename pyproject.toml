[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swingbot-research"
version = "0.1.0"
description = "Bias-aware swing-strategy research and Alpaca paper-trading tools"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
paper = [
  "alpaca-py>=0.43.5,<0.44",
  "python-dotenv>=1.0,<2",
]
dev = [
  "ruff>=0.11,<1",
]

[project.scripts]
swingbot = "swingbot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
